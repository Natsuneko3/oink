name: Deploy verified platform feed
on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      artifact:
        required: true
        type: string
permissions:
  contents: write
jobs:
  deploy:
    if: github.repository == 'Natsuneko3/oink' && github.event_name != 'release' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    concurrency:
      group: oink-update-feed-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact }}
          path: candidate-state
      - name: Merge into latest protected snapshot and fence state revision
        env:
          PLATFORM: ${{ inputs.platform }}
        run: python3 build-support/update/deploy.py prepare
      - name: Upload complete merged snapshot to the fork update-feed Release
        id: publish
        run: python3 build-support/update/release_assets.py publish --state next-state
      - name: Read back public Release assets and commit state with CAS
        id: commit
        # Every canonical asset must match the verified snapshot before state
        # advances. A failed upload or CAS restores the frozen Git parent.
        if: steps.publish.outcome == 'success'
        run: python3 build-support/update/deploy.py commit
      - name: Restore previous hosted bytes on deployment, readback or CAS failure
        if: ${{ always() && (steps.publish.outcome == 'failure' || steps.publish.outcome == 'cancelled' || (steps.publish.outcome == 'success' && steps.commit.outcome != 'success')) }}
        run: python3 build-support/update/release_assets.py rollback --state feed-state
      - name: Verify rollback bytes
        if: ${{ always() && (steps.publish.outcome == 'failure' || steps.publish.outcome == 'cancelled' || (steps.publish.outcome == 'success' && steps.commit.outcome != 'success')) }}
        run: python3 build-support/update/deploy.py verify-rollback
      - name: Failure summary
        if: failure()
        run: echo 'Feed transaction failed. Check rollback result; no candidate is marked deployed without public readback and state CAS.' >> "$GITHUB_STEP_SUMMARY"
