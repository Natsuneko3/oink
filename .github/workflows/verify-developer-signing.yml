name: Verify local developer signing
on:
  workflow_dispatch:
  push:
    branches: [codex/local-developer-signing]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'
      - name: Verify signing behavior
        run: python3 -m unittest discover -s packaging/tests -p test_apple_development_signing.py -v
      - name: Select OpenSSL 3
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Verify packaging checks
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Import the pinned development identity
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_DEVELOPMENT_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_FINGERPRINT: ${{ vars.MACOS_DEVELOPMENT_SIGNING_FINGERPRINT }}
        run: python3 packaging/macos/ci-keychain.py --development
      - name: Verify real Apple Development signature
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, shutil, subprocess, sys, tempfile
          sys.path.insert(0, 'packaging/macos')
          from signing import select_identity, verify_signature
          mac = json.loads(pathlib.Path('packaging/identity.json').read_text())['macos']
          identity = select_identity(mac['team_id'], mac['signing_fingerprint'], kind='apple-development')
          with tempfile.TemporaryDirectory() as folder:
              binary = pathlib.Path(folder) / 'signing-check'
              shutil.copyfile('/usr/bin/true', binary)
              binary.chmod(0o755)
              subprocess.run(['codesign', '--remove-signature', str(binary)], check=True, capture_output=True)
              entitlements = pathlib.Path(folder) / 'entitlements.plist'
              entitlements.write_bytes(plistlib.dumps({'com.apple.security.application-groups': [mac['team_id'] + '.' + mac['app_group_suffix']], 'com.apple.security.device.audio-input': True}))
              subprocess.run(['codesign', '--force', '--timestamp=none', '--sign', identity, '--entitlements', str(entitlements), str(binary)], check=True, capture_output=True)
              verify_signature(binary, mac['team_id'], apple_development=True)
              subprocess.run(['codesign', '-d', '--extract-certificates', str(pathlib.Path(folder) / 'cert'), str(binary)], check=True, capture_output=True)
              actual = hashlib.sha1((pathlib.Path(folder) / 'cert0').read_bytes()).hexdigest().upper()
              assert actual == mac['signing_fingerprint'], 'signer certificate fingerprint mismatch'
              subprocess.run([str(binary)], check=True)
              print('Verified Apple Development signature; team=' + mac['team_id'] + '; certificate=' + actual)
          PY
      - name: Remove ephemeral signing material
        if: always()
        run: python3 packaging/macos/ci-keychain.py cleanup
