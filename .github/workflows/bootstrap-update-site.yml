name: Bootstrap fork update Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.repository == 'Natsuneko3/oink' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: oink-update-feed-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Initialize missing disabled update-feed-state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-support/update/release_assets.py initialize-state
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          token: ${{ github.token }}
          persist-credentials: false
      - name: Require disabled state and create the update-feed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-support/update/release_assets.py bootstrap --state feed-state
