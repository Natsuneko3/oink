name: Recover custom release ARM package

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original custom release run containing Windows and Intel Mac packages
        required: true
        default: '42857199549'
        type: string
      source_commit:
        description: Exact original source commit shared by all packages
        required: true
        default: 1dd3286cba1e99d13b1f78a807d391be25b7e00e
        type: string
      build:
        description: Reserved product build from the original run
        required: true
        default: '114'
        type: string
      release_tag:
        description: New tag for the recovered custom release
        required: true
        default: v0.3.5-custom.1
        type: string
      arm_runner:
        description: Available Apple Silicon runner for the missing package
        required: true
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-15

permissions:
  contents: read

concurrency:
  group: custom-release-recovery
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
  MACOSX_DEPLOYMENT_TARGET: '14.2'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  BUILD: ${{ inputs.build }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  arm:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Natsuneko3/oink' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.arm_runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      OINK_REPORT_DSN: ''
      SENTRY_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Verify original custom release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-run.json').read_text())
          expected = {
              'head_sha': os.environ['SOURCE_COMMIT'],
              'path': '.github/workflows/custom-release.yml',
              'head_branch': 'main',
              'event': 'workflow_dispatch',
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(f'Original custom release run has unexpected {field}')
          if run.get('repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Original custom release run belongs to another repository')
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: custom-release-aarch64-apple-darwin
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ${{ runner.temp }}/package-tools
          key: custom-release-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-about0.9.2-wix5.0.2-sparkle2.9.6
      - name: Pin build tools
        run: |
          test "$(uname -m)" = arm64
          npm install --global npm@11.11.0
          if ! cargo about --version 2>/dev/null | grep -q '0.9.2$'; then cargo install cargo-about --version 0.9.2 --locked --features cli; fi
      - name: Build and stage original ARM source
        run: |
          python build-support/package.py --public-version --platform macos --arch arm64 --development-signing --build "$BUILD" --output-root "$RUNNER_TEMP/packages" --tool-cache "$RUNNER_TEMP/package-tools"
          python build-support/custom_release.py stage --packages "$RUNNER_TEMP/packages" --platform macos --build "$BUILD" --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/distribution"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custom-package-macos-${{ inputs.build }}
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
      - name: Preserve ARM debug symbols separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custom-symbols-macos-${{ inputs.build }}
          path: ${{ runner.temp }}/packages/**/symbols.noindex/**
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: arm
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Natsuneko3/oink' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Download existing Windows and Intel Mac packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: custom-package-*-${{ inputs.build }}
          path: ${{ runner.temp }}/downloaded/prior
      - name: Download recovered ARM package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: custom-package-macos-${{ inputs.build }}
          path: ${{ runner.temp }}/downloaded/current
      - name: Assemble matching assets and publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build-support/custom_release.py assemble --downloads "$RUNNER_TEMP/downloaded" --build "$BUILD" --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/release"
          python build-support/custom_release.py publish --output "$RUNNER_TEMP/release" --tag "$RELEASE_TAG" --notes .github/custom-release-notes.md

  update-feed:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Natsuneko3/oink' && github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: oink-update-feed-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
      WINDOWS_UPDATE_ED25519_PEM_WIN_2026_01: ${{ secrets.WINDOWS_UPDATE_ED25519_PEM_WIN_2026_01 }}
      OINK_FEED_LOCK: oink-update-feed-publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          token: ${{ github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Select OpenSSL 3
        run: |
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix openssl@3)/bin/openssl" version | grep '^OpenSSL 3\.'
      - name: Sign and publish custom update feeds
        id: feeds
        run: python3 build-support/update/custom_feed.py --release-tag "$RELEASE_TAG" --tool-cache "$RUNNER_TEMP/sparkle"
      - name: Recover hosted feed snapshot after interruption
        if: ${{ always() && steps.feeds.outcome != 'success' }}
        run: python3 build-support/update/custom_feed.py --recover
